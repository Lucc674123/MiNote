org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# 老代码里有大量 `switch (item.getItemId()) { case R.id.xxx: ... }` 写法。
# AGP 8.0 起资源 ID 不再是 static final 常量（加快增量构建），这些 case 会报
# 「需要常量表达式」而无法编译。
# 旧方案 android.nonFinalResIds=false 在 AGP 9.4.1 已被标记 deprecated 且实际
# 不再生效（构建日志会提示它将在 AGP 10 移除），所以改为在源码层把这 17 处
# case 标签改写成等价的 if-else。详见 运行指南.md 第五节。
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# 关闭 AGP 的「项目路径不能含非 ASCII 字符」检查。
# 本工程路径为 C:\Users\32513\Desktop\课业相关\大3上\软件工程\Notes-master，
# 含中文目录名，AGP 会因此在应用 com.android.application 插件时直接中断。
# 本项目是纯 Java、无 NDK/native 编译，关闭该检查后可以正常构建。
# 若想彻底规避该风险，见 运行指南.md 第四节「关于项目路径含中文」。
# ---------------------------------------------------------------------------
android.overridePathCheck=true
